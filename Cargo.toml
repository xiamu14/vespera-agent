[package]
name = "vespera"
version = "0.1.0"
edition = "2024"
description = "Vespera static GPUI desktop"
publish = false

[dependencies]
gpui-kit = "=0.9.0"
rust-embed = "8.13"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNUserNotificationCenter"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSSound"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData"] }

[profile.dev]
debug = 0

[profile.release]
strip = true

[features]
visual-check = ["gpui-kit/test-support"]

[[example]]
name = "visual_check"
required-features = ["visual-check"]
